name: Pinned Windows x64 build
on:
  push:
    branches: [codex/windows-x64-ebf811e]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      SOURCE_SHA: ebf811ecefb050d396ec4f6272c6e59e35a59652
      EXPECTED_LOCK: 27114f1d8724f7958e1f2ade45cb43a99c2637408dabb497624860cc69a51e1e
      RUST_VERSION: 1.100.0
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out pinned upstream
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: librecapsula/capsula-jb
          ref: ebf811ecefb050d396ec4f6272c6e59e35a59652
          path: source
          persist-credentials: false

      - name: Verify source and lockfile
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA) { throw 'Source commit mismatch' }
          if (git status --porcelain) { throw 'Source checkout is dirty' }
          if ((Get-FileHash Cargo.lock -Algorithm SHA256).Hash -ne $env:EXPECTED_LOCK) { throw 'Lockfile mismatch' }
          rustup toolchain install $env:RUST_VERSION --profile minimal --no-self-update

      - name: Run locked workspace tests
        run: |
          cargo "+$env:RUST_VERSION" test --workspace --locked --target x86_64-pc-windows-msvc

      - name: Build locked Windows x64 release
        run: |
          cargo "+$env:RUST_VERSION" build --release --locked --target x86_64-pc-windows-msvc -p jb-cli

      - name: Record hash and inspect help
        run: |
          $exe = Resolve-Path 'target/x86_64-pc-windows-msvc/release/capsula-jb.exe'
          $helpText = & $exe --help
          if ($LASTEXITCODE -ne 0 -or ($helpText -join "`n") -notmatch '\bbackup\b') { throw 'CLI help failed' }
          $backupHelp = & $exe backup --help
          if ($LASTEXITCODE -ne 0 -or ($backupHelp -join "`n") -notmatch '\bbackup\b') { throw 'backup help failed' }
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE 'delivery')
          Copy-Item -LiteralPath $exe -Destination $dir.FullName
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            upstream = 'https://github.com/librecapsula/capsula-jb'
            source_commit = (git rev-parse HEAD).Trim()
            cargo_lock_sha256 = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
            rustc = (rustc "+$env:RUST_VERSION" --version -v) -join "`n"
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
            workflow_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            target = 'x86_64-pc-windows-msvc'
            exe_sha256 = $hash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dir.FullName 'build-provenance.json') -Encoding utf8
          "$hash  capsula-jb.exe" | Set-Content -LiteralPath (Join-Path $dir.FullName 'SHA256SUMS.txt') -Encoding ascii
          $backupHelp | Out-Host

      - name: Attest executable and build manifest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            delivery/capsula-jb.exe
            delivery/build-provenance.json

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capsula-jb-windows-x64-ebf811e
          path: delivery/
          if-no-files-found: error
          retention-days: 14
